<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>준비 현황</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topnav wrap" aria-label="페이지">
    <a href="./">🗺️ 일정</a>
    <a href="plan.html" aria-current="page">📋 준비 현황</a>
  </nav>

  <header class="hero">
    <div class="wrap">
      <p class="eyebrow" id="eyebrow"></p>
      <h1>준비 현황</h1>
      <p class="meta" id="meta"></p>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" id="stats"></section>

    <section class="card" id="pending"></section>

    <section class="block">
      <h2 class="block-title">🍽️ 예약 현황</h2>
      <p class="muted block-desc">8명 + 토요일이라 웬만한 식당은 예약이나 단체석 확인이 필요합니다.</p>
      <div class="kanban" id="kanban"></div>
    </section>

    <section class="block">
      <h2 class="block-title">📍 후보 목록</h2>
      <div class="chips" id="chips" role="group" aria-label="분류 필터"></div>
      <div id="cands"></div>
    </section>

    <section class="card" id="meetings"></section>
  </main>

  <footer class="wrap foot" id="foot"></footer>

  <script src="data/board.js"></script>
  <script src="plan.js"></script>
</body>
</html>
